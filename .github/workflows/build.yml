name: build

# push 文章或代码就自动重建站点，产物提交回 master，GitHub Pages 随即更新。
# 产物提交时带 [skip ci]，不会再次触发自己。
on:
  push:
    branches: [master]
    paths:
      - "_posts/**"
      - "_pages/**"
      - "assets/**"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: 构建
        run: python3 build.py

      - name: 同步产物到仓库根
        run: python3 deploy.py .

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "build: $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi
