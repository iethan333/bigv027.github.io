name: build

# push 文章或代码就自动重建站点，产物提交回 master，GitHub Pages 随即更新。
# 产物提交时带 [skip ci]，不会再次触发自己。
on:
  push:
    branches: [master]
    paths:
      - "_posts/**"
      - "_pages/**"
      - "assets/**"
      - "*.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # apt 装的 pandoc 版本随镜像漂移，且 apt-get update 常卡在慢源上，
      # 直接取官方二进制，版本与本地保持一致。
      - name: 安装 pandoc
        run: |
          curl -sSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          pandoc -v | head -1

      - name: 构建
        run: python3 build.py

      - name: 同步产物到仓库根
        run: python3 deploy.py .

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "build: $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi
